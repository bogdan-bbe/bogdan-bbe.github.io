<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazfit Bip 6 | Custom Watch Faces by N3X71991</title>
    <style>
        :root {
            --primary-orange: #ff8c00;
            --dark-bg: #0d0d0d;
            --card-bg: #1a1a1a;
            --text-gray: #b3b3b3;
        }

        body {
            background-color: var(--dark-bg);
            color: #fff;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding-bottom: 50px;
            /* Protecție: împiedică selectarea textului */
            user-select: none;
            -webkit-user-select: none;
        }

        header {
            padding: 60px 20px;
            text-align: center;
            background: radial-gradient(circle at center, #222 0%, #0d0d0d 100%);
            border-bottom: 1px solid #333;
        }

        header h1 {
            font-size: 2.5em;
            margin: 0;
            letter-spacing: -1px;
        }

        header p {
            color: var(--primary-orange);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 10px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .watch-card {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #333;
            transition: all 0.3s ease;
            position: relative;
        }

        .watch-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary-orange);
            box-shadow: 0 10px 30px rgba(255, 140, 0, 0.2);
        }

        /* Containerul imaginii cu Watermark */
        .watch-image {
            width: 100%;
            height: 300px;
            background: #252525;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative; /* Pentru a poziționa watermark-ul peste imagine */
        }

        .watch-image img {
            width: 80%;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
            pointer-events: none; /* Împiedică salvarea imaginii prin click lung pe mobil */
        }

        /* Stilul Watermark-ului */
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            color: rgba(255, 255, 255, 0.15); /* Alb transparent */
            font-size: 1.2rem;
            font-weight: bold;
            white-space: nowrap;
            pointer-events: none; /* Să nu blocheze hover-ul pe card */
            z-index: 2;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 5px 10px;
            text-transform: uppercase;
        }

        .watch-info {
            padding: 20px;
        }

        .watch-info h3 {
            margin: 0 0 10px 0;
            font-size: 1.4em;
        }

        .price-tag {
            font-size: 1.2em;
            color: var(--primary-orange);
            font-weight: bold;
            margin-bottom: 20px;
            display: block;
        }

        .buy-btn {
            display: block;
            background: #fff;
            color: #000;
            text-align: center;
            padding: 12px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .buy-btn:hover {
            background: var(--primary-orange);
            color: #fff;
        }

        .telegram-bar {
            text-align: center;
            margin-top: 60px;
            padding: 30px;
            border-top: 1px solid #333;
        }

        .tg-link {
            color: #0088cc;
            text-decoration: none;
            font-size: 1.2em;
            font-weight: bold;
        }
    </style>
</head>
<body oncontextmenu="return false;"> <header>
    <h1>N3X71991 Watchfaces</h1>
    <p>Premium Designs for Amazfit Bip 6</p>
</header>

<div class="container">
    <div class="shop-grid">
        
        <div class="watch-card">
            <div class="watch-image">
                <img src="watchface1.png" alt="Liquid Glass">
                <div class="watermark">N3X71991 Watchfaces</div>
            </div>
            <div class="watch-info">
                <h3>Liquid Glass</h3>
                <span class="price-tag">$2.00</span>
                <a href="https://t.me/N3X71991" class="buy-btn">Cumpără / Contact</a>
            </div>
        </div>

        <div class="watch-card">
            <div class="watch-image">
                <img src="imagini/ceas2.jpg" alt="Aero Wing Edition">
                <div class="watermark">N3X71991 Watchfaces</div>
            </div>
            <div class="watch-info">
                <h3>Aero Wing Edition</h3>
                <span class="price-tag">$20.00</span>
                <a href="https://t.me/N3X71991" class="buy-btn">Cumpără / Contact</a>
            </div>
        </div>

        </div>

    <div class="telegram-bar">
        <p>Vrei un design personalizat sau suport? Contactează-mă:</p>
        <a href="https://t.me/N3X71991" class="tg-link">@N3X71991 (Telegram)</a>
    </div>
</div>

<script>
    // Blochează scurtăturile de tastatură pentru Inspect Element (Ctrl+Shift+I, F12 etc.)
    document.onkeydown = function(e) {
        if(e.keyCode == 123) return false;
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false;
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
        if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
    }

    // Blochează Drag & Drop pe imagini
    document.querySelectorAll('img').forEach(img => {
        img.addEventListener('dragstart', function(e) {
            e.preventDefault();
        });
    });
</script>

</body>
</html>
